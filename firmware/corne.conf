# Corne Wireless — config for Seeed XIAO BLE
# Enable this file for BOTH left and right halves

# ── USB / BLE ──────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ── RGB Underglow ───────────────────────────────────
# Works for both SK6812MINI-E and WS2812B
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# Turn off RGB when keyboard goes to sleep
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Number of RGB LEDs — standard Corne has 6 per half = 12 total
# (change if your board has a different count)
CONFIG_ZMK_RGB_UNDERGLOW_NUM_LEDS=6

# ── Power management / sleep ────────────────────────
CONFIG_ZMK_EXT_POWER=y
# Go to deep sleep after 30 minutes of inactivity (in seconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ── Split keyboard ──────────────────────────────────
CONFIG_ZMK_SPLIT=y

# ── Battery reporting (nice!nano / XIAO BLE) ────────
CONFIG_ZMK_BATTERY_REPORTING=y
